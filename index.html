<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>家庭账本</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232d6a5f'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34' fill='white' font-family='Arial, sans-serif'%3E%E5%AE%B6%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <section id="authGate" class="auth-gate">
      <div class="auth-panel">
        <div class="brand auth-brand">
          <div class="brand-mark">家</div>
          <div>
            <h1>家庭账本</h1>
            <p>Supabase 登录</p>
          </div>
        </div>
        <form id="authForm" class="settings-form">
          <label>
            Email
            <input name="email" type="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="密码登录时填写" minlength="6" />
          </label>
          <div class="button-row">
            <button id="passwordSignInBtn" class="primary-button" type="button">密码登录</button>
            <button class="ghost-button" type="submit">发送登录链接</button>
            <button id="passwordSignUpBtn" class="ghost-button" type="button">注册账号</button>
          </div>
          <p id="actionMessage" class="form-message" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <div id="appShell" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">家</div>
          <div>
            <h1>家庭账本</h1>
            <p id="syncStatus">Supabase 未登录</p>
            <p id="appVersion" class="app-version">版本读取中</p>
          </div>
        </div>

        <nav class="nav" aria-label="主导航">
          <button class="nav-button is-active" data-view="dashboard">总览</button>
          <button class="nav-button" data-view="fixed">日元固定收支</button>
          <button class="nav-button" data-view="accounts">日元账户</button>
          <button class="nav-button" data-view="settings">设置</button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <label for="monthPicker">账期</label>
            <input id="monthPicker" type="month" />
          </div>
          <div class="topbar-actions">
            <button id="generateMonthBtn" class="primary-button" type="button" hidden>生成本月固定项</button>
            <button id="refreshBtn" class="ghost-button" type="button">刷新</button>
          </div>
        </header>
        <p id="appMessage" class="app-message" aria-live="polite"></p>

        <section id="dashboard" class="view is-active">
          <div class="metric-grid">
            <article class="metric">
              <span>固定收入</span>
              <strong id="fixedIncomeTotal">0</strong>
            </article>
            <article class="metric">
              <span>固定支出</span>
              <strong id="fixedExpenseTotal">0</strong>
            </article>
            <article class="metric">
              <span>盈余 / 赤字</span>
              <strong id="fixedBalanceTotal">0</strong>
            </article>
            <article class="metric">
              <span>未付固定支出</span>
              <strong id="fixedUnpaidTotal">0</strong>
            </article>
          </div>

          <section class="panel">
            <div class="panel-heading">
              <h2>支付渠道小计</h2>
            </div>
            <div id="paymentGroupSummary" class="settings-list"></div>
          </section>
        </section>

        <section id="fixed" class="view">
          <section class="panel">
            <div class="panel-heading">
              <h2 id="templateFormTitle">新增固定模板</h2>
            </div>
            <form id="templateForm" class="form-grid">
              <label>
                名称
                <input name="name" type="text" placeholder="工资 / 房贷 / 信用卡" required />
              </label>
              <label>
                收支
                <select name="direction" required>
                  <option value="expense">支出</option>
                  <option value="income">收入</option>
                </select>
              </label>
              <label>
                固定类型
                <select name="fixed_type" required>
                  <option value="long_term">长期固定</option>
                  <option value="short_term">短期固定</option>
                </select>
              </label>
              <label>
                默认金额
                <input name="default_amount" type="number" inputmode="decimal" step="1" required />
              </label>
              <label>
                支付渠道
                <input name="payment_group" type="text" placeholder="乐天卡 / 邮局卡 / 现金支付" />
              </label>
              <label>
                支付日
                <input name="due_day" type="number" min="1" max="31" placeholder="27" />
              </label>
              <label>
                开始月份
                <input name="start_month" type="month" />
              </label>
              <label>
                总期数
                <input name="total_terms" type="number" min="1" placeholder="短期固定可填" />
              </label>
              <div class="button-row form-submit">
                <button id="templateSubmitBtn" class="primary-button" type="submit">保存模板</button>
                <button id="templateCancelBtn" class="ghost-button" type="button" hidden>取消编辑</button>
              </div>
            </form>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>本月固定收入</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>项目</th>
                    <th>金额</th>
                    <th>状态</th>
                    <th>期数</th>
                    <th>备注</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="incomeItemRows"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>本月固定支出</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>支付渠道</th>
                    <th>项目</th>
                    <th>金额</th>
                    <th>期限</th>
                    <th>状态</th>
                    <th>期数</th>
                    <th>备注</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="expenseItemRows"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>使用中的固定模板</h2>
            </div>
            <div id="templateRows" class="settings-list"></div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2 id="stoppedTemplateTitle">停止生成的固定模板（0）</h2>
              <button id="toggleStoppedTemplatesBtn" class="ghost-button compact-button" type="button">展开</button>
            </div>
            <div id="stoppedTemplateRows" class="settings-list" hidden></div>
          </section>
        </section>

        <section id="accounts" class="view">
          <section class="panel">
            <div class="panel-heading">
              <h2>日元余额</h2>
            </div>
            <div id="jpyBalanceRows" class="settings-list"></div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2 id="jpyTransactionFormTitle">日元零散流水登录</h2>
            </div>
            <form id="jpyTransactionForm" class="form-grid">
              <label>
                日期
                <input name="transacted_at" type="date" required />
              </label>
              <label>
                类型
                <select name="transaction_type" required>
                  <option value="expense">零散支出</option>
                  <option value="income">零散收入</option>
                  <option value="transfer">账户间转账</option>
                </select>
              </label>
              <label>
                账户
                <select id="jpyAccountSelect" name="account_id" required></select>
              </label>
              <label>
                转入账户
                <select id="jpyTransferAccountSelect" name="transfer_account_id"></select>
              </label>
              <label>
                金额
                <input name="amount" type="number" inputmode="decimal" step="1" required />
              </label>
              <label>
                内容
                <input name="description" type="text" placeholder="购物 / 临时收入 / 转账" required />
              </label>
              <label>
                备注
                <input name="note" type="text" />
              </label>
              <div class="button-row form-submit">
                <button id="jpyTransactionSubmitBtn" class="primary-button" type="submit">保存流水</button>
                <button id="jpyTransactionCancelBtn" class="ghost-button" type="button" hidden>取消编辑</button>
              </div>
            </form>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>本月零散流水</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>类型</th>
                    <th>账户</th>
                    <th>转入账户</th>
                    <th>金额</th>
                    <th>内容</th>
                    <th>备注</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="jpyTransactionRows"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>日元账户管理</h2>
            </div>
            <form id="accountForm" class="inline-form">
              <input name="name" type="text" placeholder="现金 / 银行卡" required />
              <select name="account_type" required>
                <option value="cash">现金</option>
                <option value="bank">银行卡</option>
              </select>
              <input name="opening_balance" type="number" step="1" placeholder="期初余额" required />
              <button class="primary-button" type="submit">添加</button>
            </form>
            <div id="accountRows" class="settings-list"></div>
          </section>
        </section>

        <section id="settings" class="view">
          <section class="panel">
            <div class="panel-heading">
              <h2>账户</h2>
              <span id="authState" class="badge unpaid">未登录</span>
            </div>
            <div class="settings-form">
              <div class="button-row">
                <button id="signOutBtn" class="ghost-button" type="button">退出登录</button>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script type="module" src="app.js?v=20260530-responsive-3"></script>
  </body>
</html>
